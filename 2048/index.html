<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>2048</title>
  <meta name="description" content="Та самая головоломка: свайпай плитки, складывай одинаковые числа и дойди до 2048. Оригинал — Gabriele Cirulli.">
  <meta name="pu:online" content="0">
  <meta name="pu:players" content="1">
  <meta name="theme-color" content="#faf8ef">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="pu-tg.js"></script>

  <link href="style/main.css" rel="stylesheet" type="text/css">
  <style>
    /* Pleasure Union: игра на весь экран — счёт сверху, поле по центру. */
    html, body.pu-full { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body.pu-full { display: flex; flex-direction: column; touch-action: none; }
    .pu-top { flex: none; display: flex; align-items: center; justify-content: center; position: relative;
      padding: calc(14px + env(safe-area-inset-top)) 16px 4px; }
    .pu-top .score-container { margin-top: 0; min-width: 96px; height: 30px; line-height: 52px; font-size: 30px; padding: 15px 28px; }
    .pu-restart { position: absolute; right: 16px; top: calc(18px + env(safe-area-inset-top)); width: 44px; height: 44px;
      border: 0; border-radius: 10px; background: #8f7a66; color: #f9f6f2; font-size: 24px; line-height: 44px; padding: 0; cursor: pointer; }
    .pu-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .pu-stage .container { width: 500px; margin: 0; flex: none; transform-origin: center center; }
    .pu-stage .game-container { margin-top: 0; }
  </style>
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png">
  <link rel="apple-touch-startup-image" href="meta/apple-touch-startup-image-640x1096.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)"> <!-- iPhone 5+ -->
  <link rel="apple-touch-startup-image" href="meta/apple-touch-startup-image-640x920.png"  media="(device-width: 320px) and (device-height: 480px) and (-webkit-device-pixel-ratio: 2)"> <!-- iPhone, retina -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="HandheldFriendly" content="True">
  <meta name="MobileOptimized" content="320">
  <meta name="viewport" content="width=device-width, target-densitydpi=160dpi, initial-scale=1.0, maximum-scale=1, user-scalable=no, minimal-ui">
</head>
<body class="pu-full">
  <!-- Pleasure Union: только поле и текущий счёт (God 14.10: «нужна просто
       сама игра и счётчик текущего успеха»). Рекорд и кнопка «Заново» из
       оригинала оставлены в разметке, но спрятаны — к ним привязан код игры. -->
  <div class="pu-top">
    <div class="score-container">0</div>
    <button class="pu-restart" aria-label="Заново" title="Заново">↻</button>
  </div>
  <div class="pu-stage">
    <div class="container" id="puBoard">
      <div class="game-container">
        <div class="game-message">
          <p></p>
          <div class="lower">
            <a class="keep-playing-button">Играть дальше</a>
            <a class="retry-button">Ещё раз</a>
          </div>
        </div>

        <div class="grid-container">
          <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
          <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
          <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
          <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        </div>

        <div class="tile-container"></div>
      </div>
    </div>
  </div>
  <div hidden><div class="best-container">0</div><a class="restart-button">Заново</a></div>

  <script src="js/bind_polyfill.js"></script>
  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
  <script>
    /* Поле 500×500 (вёрстка оригинала) подгоняем под экран масштабом: так
       плитки, шрифты и анимации остаются ровно как у автора на любом
       телефоне. Свайпы считаются в пикселях экрана — масштаб им не мешает. */
    (function () {
      var board = document.getElementById('puBoard');
      var stage = document.querySelector('.pu-stage');
      function fit() {
        var k = Math.min((stage.clientWidth - 24) / 500, (stage.clientHeight - 24) / 500);
        board.style.transform = 'scale(' + Math.max(0.3, k) + ')';
      }
      window.addEventListener('resize', fit);
      fit();
      // «↻» — та же кнопка «Заново», что в оригинале (она спрятана).
      document.querySelector('.pu-restart').addEventListener('click', function () {
        document.querySelector('.restart-button').click();
      });
    })();
  </script>
</body>
</html>
