<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Fish Folk: Jumpy</title>
    <!-- Pleasure Union: страница шириной 980px, как у авторов без этой метки
         (так мобильный браузер делает по умолчанию) — меню игры рассчитано
         на неё. Метка нужна, чтобы так было в любом webview, а масштаб
         пальцами не сбивал управление. -->
    <meta name="viewport" content="width=980, user-scalable=no" />
    <meta name="description" content="Рыбья перестрелка в духе Duck Game: прыгай по платформам, хватай оружие и победи ботов. Экранный геймпад, играть — положив телефон боком. Авторы — команда Fish Folk." />
    <meta name="pu:online" content="0" />
    <meta name="pu:players" content="1" />
    <meta name="theme-color" content="#000000" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="pu-tg.js"></script>
    <script src="pu-landscape.js"></script>
    <script src="pu-pad.js"></script>
    <style>
      body {
        margin: 0;
        height: 100vh;
        background-color: black;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      canvas {
        background-color: black;
      }
    </style>
    <!-- Nifty spinner from: https://github.com/loadingio/css-spinner/blob/088aefa790d015e9c7df664d426374952e65124a/dist/dual-ring.html#L1 -->
    <style type="text/css">
      .lds-dual-ring {
        width: 80px;
        height: 80px;
      }
      .lds-dual-ring:after {
        content: " ";
        display: block;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 6px solid #fff;
        border-color: #fff transparent #fff transparent;
        animation: lds-dual-ring 1.2s linear infinite;
      }
      @keyframes lds-dual-ring {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .loading-container {
        z-index: -1;
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        color: white;
      }

      .loading-container > div {
        margin: auto;
        display: flex;
        flex-direction: column;
        color: white;
        align-items: center;
      }

      .loading-text {
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        margin-top: 2em;
        font-size: 1.2em;
      }
    </style>
    <style>
      /* Pleasure Union: экранный геймпад (pu-pad.js) и просьба повернуть
         телефон. Размеры — в долях экрана: страница шириной 980px, и в
         пикселях кнопки вышли бы разными на разных телефонах. */
      .pu-pad { position: fixed; inset: 0; z-index: 5; pointer-events: none;
        font-family: 'Lucida Sans', Geneva, Verdana, sans-serif; }
      .pu-btn, .pu-dpad { pointer-events: auto; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; }
      .pu-dpad { position: absolute; left: 3vh; bottom: 3vh; width: 40vh; height: 40vh;
        border-radius: 50%; background: rgba(255, 255, 255, 0.10);
        border: 0.4vh solid rgba(255, 255, 255, 0.28); }
      .pu-arrow { position: absolute; width: 0; height: 0; border: 4.2vh solid transparent; opacity: 0.6; }
      .pu-arrow.on { opacity: 1; }
      .pu-arrow.up { left: 50%; top: 2.5vh; margin-left: -4.2vh; border-top: 0; border-bottom: 6vh solid #fff; }
      .pu-arrow.down { left: 50%; bottom: 2.5vh; margin-left: -4.2vh; border-bottom: 0; border-top: 6vh solid #fff; }
      .pu-arrow.left { top: 50%; left: 2.5vh; margin-top: -4.2vh; border-left: 0; border-right: 6vh solid #fff; }
      .pu-arrow.right { top: 50%; right: 2.5vh; margin-top: -4.2vh; border-right: 0; border-left: 6vh solid #fff; }
      .pu-acts { position: absolute; right: 3vh; bottom: 3vh; width: 44vh; height: 44vh; }
      .pu-btn { position: absolute; display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 3.6vh; text-shadow: 0 0.2vh 0.4vh #000;
        background: rgba(255, 255, 255, 0.16); border: 0.4vh solid rgba(255, 255, 255, 0.4); }
      .pu-btn.on { background: rgba(255, 255, 255, 0.42); }
      .pu-acts .pu-btn { width: 15vh; height: 15vh; border-radius: 50%; }
      .pu-btn.jump { left: 14.5vh; bottom: 0; width: 17vh; height: 17vh; background: rgba(62, 199, 97, 0.35); }
      .pu-btn.slide { left: 14.5vh; top: 0; }
      .pu-btn.shoot { left: 0; top: 14.5vh; background: rgba(245, 42, 42, 0.32); }
      .pu-btn.grab { right: 0; top: 14.5vh; }
      .pu-top { position: absolute; top: 2vh; left: 50%; transform: translateX(-50%);
        display: flex; gap: 2vh; }
      .pu-top .pu-btn { position: static; padding: 1.6vh 4.5vh; border-radius: 4vh; font-size: 3.6vh; }

      #pu-rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #000; color: #e0e0e0;
        font-family: 'Lucida Sans', Geneva, Verdana, sans-serif; flex-direction: column;
        justify-content: center; align-items: center; text-align: center; padding: 6vw; box-sizing: border-box; }
      @media (orientation: portrait) and (pointer: coarse) { #pu-rotate { display: flex; } }
      #pu-rotate svg { width: 24vw; height: 24vw; margin-bottom: 5vw; animation: pu-turn 2.4s ease-in-out infinite; }
      @keyframes pu-turn { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
      #pu-rotate b { font-size: 5.4vw; margin-bottom: 2.5vw; }
      #pu-rotate small { font-size: 3.6vw; color: #9a98a3; max-width: 72vw; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="pu-rotate">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
        <rect x="19" y="6" width="26" height="52" rx="5" />
        <line x1="28" y1="51" x2="36" y2="51" />
      </svg>
      <b>Поверни телефон боком</b>
      <small>Не поворачивается — выключи блокировку поворота экрана.</small>
    </div>
    <div class="loading-container">
      <div>
        <div class="lds-dual-ring"></div>
        <div class="loading-text">Загрузка…</div>
      </div>
    </div>
    <script>
      // Insert hack to make sound autoplay on Chrome as soon as the user interacts with the tab:
      // https://developers.google.com/web/updates/2018/11/web-audio-autoplay#moving-forward
      (function () {
        // An array of all contexts to resume on the page
        const audioContextList = [];

        // An array of various user interaction events we should listen for
        const userInputEventNames = [
          "click",
          "contextmenu",
          "auxclick",
          "dblclick",
          "mousedown",
          "mouseup",
          "pointerup",
          "touchend",
          "keydown",
          "keyup",
        ];

        // A proxy object to intercept AudioContexts and
        // add them to the array for tracking and resuming later
        self.AudioContext = new Proxy(self.AudioContext, {
          construct(target, args) {
            const result = new target(...args);
            audioContextList.push(result);
            return result;
          },
        });

        // To resume all AudioContexts being tracked
        function resumeAllContexts(event) {
          let count = 0;

          audioContextList.forEach((context) => {
            if (context.state !== "running") {
              context.resume();
            } else {
              count++;
            }
          });

          // If all the AudioContexts have now resumed then we
          // unbind all the event listeners from the page to prevent
          // unnecessary resume attempts
          if (count && count == audioContextList.length) {
            userInputEventNames.forEach((eventName) => {
              document.removeEventListener(eventName, resumeAllContexts);
            });
          }
        }

        // We bind the resume function for each user interaction
        // event on the page
        userInputEventNames.forEach((eventName) => {
          document.addEventListener(eventName, resumeAllContexts);
        });
      })();
    </script>
    <script type="module">
      import init from "./jumpy.js";
      init();
      const ignoreCanvasContextMenu = () => {
        const canvases = document.getElementsByTagName('canvas');
        if (canvases[0]) {
            canvases[0].oncontextmenu = (e) => {
                e.preventDefault()
            };
        } else {
            setTimeout(ignoreCanvasContextMenu, 1000)
        }
      };
      setTimeout(ignoreCanvasContextMenu, 1000)
    </script>
  </body>
</html>
